
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d14;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:28px 20px;border-bottom:1px solid #25283a}
.logo{font-size:27px;font-weight:bold;color:#a78bfa}
.logo span{color:white}
main{max-width:650px;margin:auto;padding:24px 18px}
h1{font-size:32px;margin-top:30px}
p{color:#a7a9bb;line-height:1.6}
.card{margin-top:25px;padding:18px;background:#151827;border:1px solid #30344b;border-radius:20px}
#chat{min-height:170px;max-height:45vh;overflow:auto}
.msg{padding:12px;margin:10px 0;border-radius:12px;line-height:1.5;white-space:pre-wrap}
.bot{background:#25243c}
.user{background:#5541a5;margin-left:25px}
form{display:flex;gap:8px;margin-top:12px}
input{min-width:0;flex:1;background:#0d101b;border:1px solid #393d53;border-radius:12px;padding:14px;color:white;font-size:16px}
button{border:0;border-radius:12px;background:#8b5cf6;color:white;padding:13px 16px;font-size:16px}
small{color:#9296aa}
</style>
</head>
<body>
<header><div class="logo">✦ NOVA <span>AI</span></div></header>
<main>
<h1>Привет! 👋</h1>
<p>Я NOVA — твой будущий ИИ-помощник. Чем займёмся сегодня?</p>
<div class="card">
<div id="chat">
<div class="msg bot">Привет! Напиши мне что-нибудь 👇</div>
</div>
<form id="form">
<input id="question" placeholder="Напиши сообщение..." autocomplete="off">
<button type="submit">➤</button>
</form>
</div>
<p><small>Демо-версия NOVA AI · Подключение ИИ добавим позже</small></p>
</main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('question');
const chat=document.getElementById('chat');
form.addEventListener('submit',function(e){
e.preventDefault();
const q=input.value.trim();
if(!q)return;
const user=document.createElement('div');
user.className='msg user';
user.textContent=q;
chat.appendChild(user);
const bot=document.createElement('div');
bot.className='msg bot';
bot.textContent='Я пока демо-версия NOVA. Настоящий ИИ подключим следующим шагом! ✨';
chat.appendChild(bot);
input.value='';
chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
